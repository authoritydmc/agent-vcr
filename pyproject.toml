[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-vcr"
version = "0.1.0"
description = "Deterministic record and replay for LLM agent tool calls and completions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "OpenSource Contributor", email = "dev@example.com" },
]
keywords = ["llm", "agents", "vcr", "testing", "mocking", "ai", "recording"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.entry-points.pytest11]
agent_vcr = "agent_vcr.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_vcr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
